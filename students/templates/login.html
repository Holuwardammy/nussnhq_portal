{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}?v=4">
</head>

<body>

<div class="login-container">

    <h2>Login</h2>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <label for="username">Email or Serial Number</label>
        <input type="text" id="username" name="username" placeholder="Enter email or serial number" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>

        <button type="submit">Login</button>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

    </form>

    <p>Don't have an account? 
        <a href="{% url 'register_student' %}">Register here</a>
    </p>

</div>

</body>
</html>
